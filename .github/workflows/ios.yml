name: iOS host build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    name: C++ runtime contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Initialize pinned Source dependencies
        run: git -C third_party/source submodule update --init --depth 1 thirdparty ivp
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSOURCE_BUILD_CSTRIKE=ON -DSOURCE_LINK_CSTRIKE=ON
      - run: cmake --build build --parallel 4
      - run: python3 scripts/verify_cstrike_archives.py build --linked
      - run: ctest --test-dir build --output-on-failure
      - name: Prepare and verify iOS GLES optimization paths
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get install -y libegl1 libgl1-mesa-dri
          python3 scripts/prepare_clientmod.py third_party/clientmod build/clientmod-regression third_party/source
          python3 scripts/prepare_clientmod_graphics.py third_party/clientmod build/clientmod-regression third_party/source build/source-port
          python3 tests/gles_astc_upload.py build/clientmod-regression
          python3 tests/ios_model_validation_cache.py
          python3 tests/ios_fence_polling.py build/clientmod-regression
          python3 tests/gles_vertex_submission.py build/clientmod-regression
          python3 tests/gles_fence_polling.py
          python3 tests/gles_indexed_draw.py build/clientmod-regression
          python3 tests/gles_driver_work.py build/clientmod-regression
          python3 tests/ios_native_vao_cache.py
          python3 tests/gles_native_vao.py build/clientmod-regression
          python3 tests/gles_clear_viewport.py build/clientmod-regression
          python3 tests/gles_state_writes.py build/clientmod-regression
          python3 tests/gles_srgb_writes.py build/clientmod-regression/togles/linuxwin/dx9asmtogl2.cpp
          python3 tests/gles_streaming_and_cache.py
          python3 tests/gles_sampler_objects.py
  ios:
    name: Original ClientMod iOS ARM64 IPA
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Initialize pinned Source dependencies
        run: git -C third_party/source submodule update --init --depth 1 thirdparty ivp
      - name: Configure original ClientMod device app
        run: >-
          cmake -S . -B build-ios -G "Unix Makefiles"
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0
          -DCMAKE_BUILD_TYPE=Release -DSOURCE_BUILD_CSTRIKE=ON
          -DSOURCE_BUILD_CLIENTMOD=ON -DSOURCE_BUILD_CLIENTMOD_GRAPHICS=ON
          -DSOURCE_BUILD_CLIENTMOD_RUNTIME=ON -DSOURCE_CLIENTMOD_IOS_APP=ON
      - name: Compile app sources and link UIKit context adapter first
        run: |
          cmake --build build-ios --target src/ios/ClientModMain.mm.o src/runtime/CrashDiagnostics.cpp.o --parallel 2
          cmake --build build-ios --target clientmod_runtime_launcher --parallel 4
      - name: Build original client app and modules
        run: cmake --build build-ios --target Source1IOS --parallel 4
      - name: Verify original module bundle and ARM64 dependencies
        run: python3 scripts/verify_clientmod_bundle.py build-ios/Source1IOS.app
      - name: Package original ClientMod unsigned IPA
        run: |
          python3 scripts/package_ipa.py build-ios/Source1IOS.app artifacts/Source1IOS-ClientMod-unsigned.ipa
          shasum -a 256 artifacts/Source1IOS-ClientMod-unsigned.ipa > artifacts/SHA256SUMS.txt
      - name: Upload original ClientMod IPA
        uses: actions/upload-artifact@v4
        with:
          name: Source1IOS-ClientMod-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
