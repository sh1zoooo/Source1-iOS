name: iOS host build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    name: C++ runtime contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Initialize pinned Source dependencies
        run: git -C third_party/source submodule update --init --depth 1 thirdparty ivp
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSOURCE_BUILD_CSTRIKE=ON
      - run: cmake --build build --parallel 4
      - run: python3 scripts/verify_cstrike_archives.py build
      - run: ctest --test-dir build --output-on-failure
  ios:
    name: iOS ARM64 IPA and simulator smoke
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Initialize pinned Source dependencies
        run: git -C third_party/source submodule update --init --depth 1 thirdparty ivp
      - name: Toolchain
        run: |
          xcodebuild -version
          cmake --version
      - name: Configure device build
        run: >-
          cmake -S . -B build-ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0
          -DSOURCE_BUILD_CSTRIKE=ON
      - name: Build device app
        run: cmake --build build-ios --config Release -- -quiet CODE_SIGNING_ALLOWED=NO
      - name: Verify original CS:S compilation archives
        run: python3 scripts/verify_cstrike_archives.py build-ios/Release-iphoneos
      - name: Upload iPhone ARM64 game compilation archives
        uses: actions/upload-artifact@v4
        with:
          name: CStrike-ARM64-compile-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            build-ios/Release-iphoneos/libsource_cstrike_server.a
            build-ios/Release-iphoneos/libsource_particles.a
            build-ios/Release-iphoneos/libsource_dmxloader.a
            build-ios/Release-iphoneos/libsource_choreoobjects.a
            build-ios/Release-iphoneos/libsource_soundemittersystem.a
            build-ios/Release-iphoneos/libsource_scenefilecache.a
            cmake/cstrike-files.json
            docs/CSTRIKE-COMPILE.md
            third_party/SOURCE1_LICENSE.txt
            third_party/SOURCE1_THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          retention-days: 14
      - name: Package unsigned IPA
        run: |
          python3 scripts/package_ipa.py build-ios/Release-iphoneos/Source1IOS.app artifacts/Source1IOS-unsigned.ipa
          shasum -a 256 artifacts/Source1IOS-unsigned.ipa > artifacts/SHA256SUMS.txt
      - name: Configure simulator build
        run: >-
          cmake -S . -B build-sim -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphonesimulator
          -DCMAKE_OSX_ARCHITECTURES=$(uname -m)
          -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0
      - name: Build simulator app
        run: cmake --build build-sim --config Release -- -quiet CODE_SIGNING_ALLOWED=NO
      - name: Verify simulator startup
        run: python3 scripts/simulator_smoke.py build-sim/Release-iphonesimulator/Source1IOS.app
      - name: Upload IPA and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Source1IOS-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
