name: Original ClientMod compilation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clientmod-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: ClientMod original source coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: git -C third_party/source submodule update --init --depth 1 thirdparty ivp
      - run: cmake -S . -B build-clientmod -DCMAKE_BUILD_TYPE=Release -DSOURCE_BUILD_CLIENTMOD=ON
      - run: cmake --build build-clientmod --target clientmod_compile_check clientmod_shader_tests --parallel 4
      - run: python3 scripts/verify_clientmod_archives.py build-clientmod
      - run: ctest --test-dir build-clientmod --output-on-failure -R clientmod_original_shader_registry
  ios:
    name: ClientMod original modules for iPhone ARM64
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: git -C third_party/source submodule update --init --depth 1 thirdparty ivp
      - name: Configure original modules
        run: >-
          cmake -S . -B build-clientmod-ios -G "Unix Makefiles"
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0
          -DCMAKE_BUILD_TYPE=Release -DSOURCE_BUILD_CLIENTMOD=ON
      - name: Compile original modules
        # Continue independent objects after an error so one attempt reports all
        # outstanding platform incompatibilities. Make still exits nonzero.
        run: cmake --build build-clientmod-ios --target clientmod_compile_check --parallel 4 -- -k
      - run: python3 scripts/verify_clientmod_archives.py build-clientmod-ios --ios
      - uses: actions/upload-artifact@v4
        with:
          name: ClientMod-ARM64-compilation-${{ github.sha }}
          path: |
            build-clientmod-ios/libclientmod_*.a
            cmake/clientmod-files.json
            docs/CLIENTMOD-ORIGINAL-MODULES.md
            third_party/clientmod/README.md
            third_party/SOURCE1_LICENSE.txt
            third_party/SOURCE1_THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          retention-days: 14
